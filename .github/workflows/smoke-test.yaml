name: 'Smoke Test'
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 0 * * *'
  repository_dispatch:
    types: ['agent-broker-workflow']
  workflow_dispatch:
    inputs:
      ipa_notations:
        description: 'JSON array of IPA notations to test'
        required: false
        type: 'string'
jobs:
  smoke-test:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.workflow == 'smoke-test.yaml'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
    env:
      IPA_NOTATIONS: ${{ github.event.client_payload.inputs.ipa_notations || github.event.inputs.ipa_notations || '' }}

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v7'
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.ref }}
      - name: 'Install Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6'
        with:
          bun-version: 'latest'
      - name: 'Install Bun packages'
        run: 'bun install --frozen-lockfile'
      - name: 'Validate supplied IPA notations'
        if: env.IPA_NOTATIONS != ''
        run: |
          jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "string" and length > 0)
          ' <<< "$IPA_NOTATIONS" > /dev/null
      - name: 'Run smoke test'
        id: 'smoke-test'
        continue-on-error: true
        run: |
          if [[ -z "$IPA_NOTATIONS" ]]; then
            bun run src/scripts/smoke-test.ts 2> failures.json
            exit
          fi

          mapfile -t ipa_notations < <(jq -r '.[]' <<< "$IPA_NOTATIONS")
          bun run src/scripts/smoke-test.ts "${ipa_notations[@]}" 2> failures.json
      - name: 'Report failures'
        if: steps.smoke-test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CURRENT_BODY=$(gh api repos/${{ github.repository }}/issues/576 --jq '.body')

          while IFS= read -r entry; do
            WORD=$(echo "$entry" | jq -r '.word // "—"')
            IPA=$(echo "$entry" | jq -r '.ipa')
            ERROR=$(echo "$entry" | jq -r '.error')

            if echo "$CURRENT_BODY" | grep -qF "`${IPA}`"; then
              echo "Skipping duplicate IPA: ${IPA}"
              continue
            fi

            NEW_ROW="| ${WORD} | `${IPA}` | ${ERROR} | ${TIMESTAMP} |"
            CURRENT_BODY="${CURRENT_BODY}"$'\n'"${NEW_ROW}"
          done < <(jq -c '.[]' failures.json)

          gh api repos/${{ github.repository }}/issues/576 \
            --method PATCH \
            --input - \
            <<< "$(jq -n --arg body "$CURRENT_BODY" '{"body": $body}')"
